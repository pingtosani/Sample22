<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
        }
        form {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 300px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #0070f3;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0051bb;
        }
        #responseMessage {
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <h2>User Registration</h2>
    
    <form id="userForm">
        <input type="text" id="name" placeholder="Name" required>
        <input type="number" id="age" placeholder="Age" required>
        <select id="sex" required>
            <option value="">Select Sex</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>
        <button type="submit">Submit Data</button>
    </form>

    <h3 id="responseMessage"></h3>

    <script>
        const form = document.getElementById('userForm');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // Stop page from refreshing

            // 1. Gather values from form inputs
            const userData = {
                name: document.getElementById('name').value,
                age: parseInt(document.getElementById('age').value),
                sex: document.getElementById('sex').value
            };

            // 2. Pointing to your live backend endpoint
            const backendUrl = 'https://onrender.com';

            document.getElementById('responseMessage').innerText = "Submitting...";

            try {
                // 3. Send payload over the internet to your Python API
                const response = await fetch(backendUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                const result = await response.json();
                
                // 4. Print server message to screen
                document.getElementById('responseMessage').innerText = result.message;
                
                // Clear the form if upload was successful
                if(result.status === "success") {
                    form.reset();
                }
            } catch (error) {
                document.getElementById('responseMessage').innerText = "Error connecting to server.";
                console.error(error);
            }
        });
    </script>
</body>
</html>
